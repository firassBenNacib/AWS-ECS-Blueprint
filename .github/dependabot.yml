version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: gomod
    directory: /tests/terratest
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: terraform
    directories:
      - /
      - /prod-app
      - /nonprod-app
      - /modules/*
    schedule:
      interval: weekly
    labels:
      - dependencies
