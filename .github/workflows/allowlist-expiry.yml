name: Allowlist Expiry Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  allowlist-expiry-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Upcoming Allowlist Expiry
        run: bash .scripts/check_allowlist_expiry_window.sh ci/allowlists 14
